onboarding = false

[theme.custom]
# The active tab is panel_bg text on the accent, so panel_bg must be dark
panel_bg = "black"

[worktrees]
directory = "~/repos/.worktrees"

[keys]
reload_config = "prefix+q"
settings = "prefix+shift+s"
detach = "prefix+d"
workspace_picker = "prefix+s"

open_worktree = "prefix+shift+t"
remove_worktree = "prefix+shift+d"

copy_mode = "prefix+["

# Agents, in the ar.triage plugin's order
next_agent = "prefix+]"
previous_agent = "prefix+\\"

split_horizontal = ['prefix+"', "alt+enter"]
split_vertical = ["prefix+percent", "alt+shift+enter"]
close_pane = "alt+esc"
cycle_pane_next = ["prefix+;", "prefix+o", "prefix+tab"]
swap_pane_right = ""

focus_pane_left = ["prefix+h", "ctrl+alt+left"]
focus_pane_down = ["prefix+j", "ctrl+alt+down"]
focus_pane_up = ["prefix+k", "ctrl+alt+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+right"]

navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]

resize_mode = ["prefix+r", "prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]
resize_pane_left = ["prefix+left", "ctrl+alt+shift+left"]
resize_pane_down = ["prefix+down", "ctrl+alt+shift+down"]
resize_pane_up = ["prefix+up", "ctrl+alt+shift+up"]
resize_pane_right = ["prefix+right", "ctrl+alt+shift+right"]

# The default prefix+shift+p is previous_workspace here
rename_pane = "prefix+shift+o"

rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

new_workspace = "prefix+shift+c"
rename_workspace = 'prefix+$'
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Plugin setup: AGENTS.md here. Not last_pane, which also crosses tabs
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "ar.last-workspace.toggle"
description = "go to last space"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "ar.triage.open"
description = "agent triage picker"

[[keys.command]]
key = "prefix+w"
type = "plugin_action"
command = "ar.triage.next"
description = "next agent that needs you"

[[keys.command]]
key = "prefix+x"
type = "plugin_action"
command = "ar.confirm-close.open"
description = "confirm close pane"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "hm"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk review changes"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "send hunk review to agent"

[ui]
accent = "blue"
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false
prompt_new_tab_name = false
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]
agent_panel_sort = "priority"

# ar.triage adds the $triage pin/unread/woke label and hides parked agents
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", { token = "state_text", rules = [
    # T3 Code's status colors (Working, Completed, Pending Approval)
    { equals = "working", fg = "#7dd3fc", bold = true },
    { equals = "done", fg = "#6ee7b7", bold = true },
    { equals = "blocked", fg = "#fcd34d", bold = true },
    { equals = "idle", dim = true },
  ] }, { token = "$triage", rules = [
    { contains = "unread", bold = true },
    { contains = "woke", bold = true },
  ] }],
]
[ui.toast]
delivery = "terminal"
