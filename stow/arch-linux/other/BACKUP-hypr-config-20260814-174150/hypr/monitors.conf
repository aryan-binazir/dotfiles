# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Keep the direct HDMI output active at native resolution, but use more
# workspace than Hyprland's auto-selected 1.5 scale.
env = GDK_SCALE,2
monitor=,preferred,auto,2.5

# Disable duplicate DisplayPort outputs exposed by USB-C docks. The same Dell
# panel can come back as DP-9, DP-10, or another DP-* connector after reconnect.
monitor=DP-1,disable
monitor=DP-2,disable
monitor=DP-3,disable
monitor=DP-4,disable
monitor=DP-5,disable
monitor=DP-6,disable
monitor=DP-7,disable
monitor=DP-8,disable
monitor=DP-9,disable
monitor=DP-10,disable
monitor=DP-11,disable
monitor=DP-12,disable
monitor=DP-13,disable
monitor=DP-14,disable
monitor=DP-15,disable
monitor=DP-16,disable

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.6

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# Or for ultrawide monitors like 34" 3440x1440 or 49" 5120x1440
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Portrait/rotated secondary monitor (transform: 1 = 90°, 3 = 270°)
# monitor = DP-2, preferred, auto, 1, transform, 1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# Disable the second ghost monitor on an Apple 6K XDR over Thunderbolt
# monitor=DP-2,disable
