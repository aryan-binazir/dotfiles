set -g default-terminal "tmux-256color"
set -g default-command "zsh" # only on zsh
# set -g default-command "bash" # only on bash
set -g focus-events on
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u

set -g prefix C-b

unbind r
bind r source-file ~/.config/tmux/tmux.conf
bind s choose-tree -sZ -O name

bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Right resize-pane -R 5
bind -r Left resize-pane -L 5

bind-key f run-shell "tmux neww ~/.local/bin/tm"

# New windows open at the session's root dir (set by tm's new-session -c);
# splits follow the current pane. Default for both is the attaching client's
# cwd, which is usually ~.
bind c new-window -c "#{session_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Navigation between panes with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r m resize-pane -Z

bind s run-shell ~/.config/tmux/scripts/update-branches.sh \; choose-tree -sZ -O name -F '#{?pane_format,#{pane_current_command} "#{pane_title}",#{?window_format,#{window_name}#{window_flags} (#{window_panes} panes),#{?@ai_spinner_s,#{@ai_spinner_s} ,}#{?@branch,[#{@branch}] ,}#{session_windows} windows#{?session_attached, (attached),}}}'

bind g split-window -h -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-pane -L \; split-window -v -c "#{pane_current_path}" \; select-pane -t 1

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

bind v copy-mode

unbind -T copy-mode-vi MouseDragEnd1Pane

set -sg escape-time 10

set -g @plugin 'tmux-plugins/tpm' # Clone first! git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm

set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @themepack 'powerline/default/gray'
set -g @themepack-window-status-format '#I:#W#F#{@ai_spinner}'
set -g @themepack-window-status-current-format '#I:#W#F#{@ai_spinner}'
set -g @theme-status-left '#[fg=colour233,bg=colour245,bold] #S #[fg=colour245,bg=colour240,nobold]#[fg=colour233,bg=colour240] #(whoami) #[fg=colour240,bg=colour233,nobold]'
set -g @theme-status-right '#[fg=colour240,bg=colour233]#[fg=colour233,bg=colour240] %a %H:%M #[fg=colour245,bg=colour240]#[fg=colour233,bg=colour245,bold] #H '

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '0'

# Start window numbering from 1
set -g base-index 1

# Start pane numbering from 1
setw -g pane-base-index 1
set -g renumber-windows on

# Themepack caches these with `set -o` (set-if-unset); clear so reloads pick up format changes
set -gu @theme-window-status-format
set -gu @theme-window-status-current-format

run '~/.config/tmux/plugins/tpm/tpm' # prefix+I to refresh

# Worktree-aware window names
run-shell -b "~/.config/tmux/scripts/window-checkout-names.sh"

# AI spinner daemon (see scripts/ai-spinner.sh)
run-shell -b "~/.config/tmux/scripts/ai-spinner.sh"
